name: The real map

# BA-5 (the live line's M136): Google's real map, in a production build
# (playwright.google.config.ts, tests/google).
# - Every night, on the quarterly channel (what production loads) and the weekly one (what the
#   next quarter will bring), with the test run's own key. Without the key the nightly run is
#   inert: it says so and stops, and bills nothing.
# - By hand from the Actions tab, before a release that changes the map, and when a push changes
#   the map's code or these tests: the quarterly channel only. Without the key, the tests that
#   need none still run (nothing leaves for Google before the map is wanted, every way the map
#   can fail ends in Gaff's sentence, and the map's pages are entered and left with new
#   documents); the tests of the map itself are skipped.
#
# The key is the GOOGLE_MAPS_TEST_KEY secret (docs/deploy.md, "The search map"): restricted to
# http://localhost:3100 and to the Maps JavaScript API, with a daily cap of 100 map loads.

on:
  workflow_dispatch:
  schedule:
    # 03:23 UTC, every night.
    - cron: '23 3 * * *'
  push:
    paths:
      - .github/workflows/map.yml
      - playwright.google.config.ts
      - tests/google/**
      - next.config.ts
      - src/lib/csp.ts
      - src/lib/map.ts
      - src/lib/map-pages.ts
      - src/ui/GoogleLoader.tsx
      - src/ui/GooglePinMap.tsx
      - src/ui/GoogleSearchMap.tsx
      - src/ui/MapBoundary.tsx
      - src/ui/SearchMap.tsx
      - src/ui/PinPicker.tsx
      - src/domain/map/**

permissions:
  contents: read

concurrency:
  group: map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map:
    name: Google's map (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(github.event_name == 'schedule' && '["quarterly","weekly"]' || '["quarterly"]') }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Synthetic data only. The app role is not a superuser, so row-level security applies.
      E2E_DATABASE_URL: postgres://gaff:gaff@localhost:5432/gaff_e2e
      NEXT_TELEMETRY_DISABLED: '1'
      GOOGLE_MAPS_VERSION: ${{ matrix.channel }}
      # A browser key: it's in every page that shows the map, so its restrictions and its cap
      # are what protect it. It's a secret here so that logs don't print it.
      GOOGLE_MAPS_TEST_KEY: ${{ secrets.GOOGLE_MAPS_TEST_KEY }}
      GOOGLE_MAPS_TEST_MAP_ID: ${{ vars.GOOGLE_MAPS_TEST_MAP_ID }}
      GOOGLE_MAPS_TEST_MAP_ID_DARK: ${{ vars.GOOGLE_MAPS_TEST_MAP_ID_DARK }}
      # The nightly run does nothing without the key.
      INERT: ${{ github.event_name == 'schedule' && secrets.GOOGLE_MAPS_TEST_KEY == '' }}
    steps:
      - name: Say whether this run has its key
        run: |
          if [ -z "$GOOGLE_MAPS_TEST_KEY" ]; then
            if [ "$INERT" = "true" ]; then
              echo "::notice title=No Google key::GOOGLE_MAPS_TEST_KEY isn't set, so the nightly real-map run does nothing (docs/deploy.md, The search map)."
            else
              echo "::warning title=No Google key::GOOGLE_MAPS_TEST_KEY isn't set, so the tests of the map itself are skipped. Only the tests that need no key run."
            fi
          fi
      - uses: actions/checkout@v4
        if: env.INERT != 'true'
      - uses: pnpm/action-setup@v4
        if: env.INERT != 'true'
      - uses: actions/setup-node@v4
        if: env.INERT != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.INERT != 'true'
      - name: Create the app database role
        if: env.INERT != 'true'
        run: psql postgres://postgres:postgres@localhost:5432/postgres -c "create role gaff login password 'gaff' createdb nosuperuser nobypassrls"
      - run: pnpm build:map
        if: env.INERT != 'true'
      - run: pnpm exec playwright install --with-deps chromium
        if: env.INERT != 'true'
      - run: pnpm test:map
        if: env.INERT != 'true'
      # For a person to look over: they aren't compared, because Google's map changes.
      - uses: actions/upload-artifact@v4
        if: always() && env.INERT != 'true'
        with:
          name: map-screenshots-${{ matrix.channel }}
          path: screenshots/google/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure() && env.INERT != 'true'
        with:
          name: map-report-${{ matrix.channel }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
