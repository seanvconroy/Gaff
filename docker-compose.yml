# Local Postgres 16 for development: `docker compose up -d`.
# Creates the non-superuser `gaff` role (so row-level security applies) and gaff_dev.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
