<!doctype html>
<html lang="en-IE" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search on a phone · Gaff search redesign mockup</title>
<link rel="stylesheet" href="mockup.css">
</head>
<body class="phone">
<div class="sheet">
<div class="mSheetHead">
<button class="plainButton" type="button" aria-label="Back to the homes"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
<div class="where isFocused"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="whereText">Kins<span class="caret"></span></span><button class="clearButton" type="button" aria-label="Clear"><svg class="icon iconSm" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
</div>
<div class="suggestSheet" role="listbox" aria-label="Suggestions">
<p class="groupLabel">Places</p>
<ul role="group" aria-label="Places">
<li class="option isActive" role="option" aria-selected="true">
<span class="optionTile"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg></span>
<span class="optionText"><span class="optionName"><b>Kins</b>ale</span><span class="muted">Town in County Cork · 4 homes</span></span>
</li>
<li class="option" role="option" aria-selected="false">
<span class="optionTile"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg></span>
<span class="optionText"><span class="optionName"><b>Kins</b>ealy</span><span class="muted">Village in County Dublin · 1 home</span></span>
</li>
</ul>
<p class="groupLabel">Streets</p>
<ul role="group" aria-label="Streets">
<li class="option" role="option" aria-selected="false">
<span class="optionTile"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg></span>
<span class="optionText"><span class="optionName"><b>Kins</b>ale Road</span><span class="muted">Ballyphehane, Cork</span></span>
</li>
</ul>
<p class="suggestFoot">Places from OpenStreetMap and Tailte Éireann</p>
</div>
<div></div>
</div>
</body>
</html>
